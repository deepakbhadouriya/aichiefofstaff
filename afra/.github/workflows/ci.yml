name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install .

      - name: Compile Python sources
        run: python -m compileall apps libs services

      - name: Run acceptance tests
        run: python -m unittest discover -s tests -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afra/apps/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: afra/apps/dashboard/package.json

      - name: Install dashboard dependencies
        run: npm install

      - name: Build dashboard
        run: npm run build
